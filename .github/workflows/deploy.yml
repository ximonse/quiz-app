name: Deploy via SFTP
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, zip, simplexml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- assets/vendor
      - run: npm test
      - run: npm ci --prefix tests/browser --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Deploy
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            open -u $SFTP_USER,$SFTP_PASS sftp://$SFTP_HOST:$SFTP_PORT;
            mirror -R --verbose \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob data/*.json \
              --exclude-glob data/materials/*.pdf \
              --exclude-glob data/images/ \
              --exclude-glob backup-*/ \
              --exclude-glob .claude/ \
              --exclude-glob tests/ \
              --exclude-glob node_modules/ \
              --exclude-glob scripts/ \
              --exclude-glob test-*.php \
              ./ /customers/a/b/a/ximon.se/httpd.www/quiz-app/
          "